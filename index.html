<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 구역 · 예배와 기도</title>
<meta name="description" content="구역 예배 출석과 기도제목을 함께 기록합니다">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d8a852'/%3E%3Cpath d='M32 12v40M20 25h24' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{font:16px system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#504434;background:#fffaf0}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9d763b;outline-offset:2px}.shell{max-width:1040px;margin:auto;min-height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr)}aside{padding:30px 18px;background:#fffdf8;border-right:1px solid #f0e5d1}.brand{font-size:1.24rem;font-weight:800}.brand b{display:inline-grid;place-items:center;background:#e8ba61;color:white;border-radius:10px;width:34px;height:34px;margin-right:8px}.small{font-size:.87rem;color:#766d60;line-height:1.5}.nav{display:grid;gap:6px;margin-top:34px}.nav button{border:0;text-align:left;background:transparent;color:#715b3c;padding:12px 13px;border-radius:12px;font-weight:700}.nav button.active{background:#fff0ce}main{padding:30px clamp(18px,5vw,48px) 90px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}h1{font-size:1.65rem;letter-spacing:-.05em;margin:4px 0}h2{font-size:1.17rem;margin:0 0 16px}h3{font-size:1rem}.eyebrow{font-size:.88rem;color:#93671e;font-weight:800}.card{background:#fff;border:1px solid #f0e3cb;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px #6445120e}.warm{background:#fff0c9}.muted{color:#766b5e;line-height:1.6}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.primary,.secondary,.ghost{border-radius:12px;font-weight:750;padding:10px 14px}.primary{background:#ae7d32;border:1px solid #ae7d32;color:white}.secondary{background:white;border:1px solid #d9c297;color:#715129}.ghost{border:0;background:transparent;color:#815c26}.week-grid{display:flex;flex-wrap:wrap;gap:8px}.check{border:1px solid #dccaaa;background:white;color:#645849;border-radius:11px;min-width:67px;padding:10px 13px;font-weight:750}.check.on{background:#f8dc94;border-color:#e8c566;color:#5c421b}.field{display:grid;gap:7px;margin:14px 0;color:#5d4c34;font-weight:700}.field input,.field textarea,.field select{border:1px solid #ddcaaa;border-radius:12px;padding:11px 13px;width:100%;background:#fff;color:#443b2e}.field textarea{min-height:110px;resize:vertical}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.number{max-width:115px}.notice{border-radius:13px;padding:12px 14px;background:#edf7e9;color:#47653c;margin-bottom:16px}.notice.error{background:#fff0e9;color:#984b36}.person,.prayer{border-top:1px solid #f0e5d3;padding:17px 0}.person:first-child,.prayer:first-child{border-top:0}.person strong{display:block;margin-bottom:12px}.prayer p{white-space:pre-wrap;line-height:1.6}.tag{border-radius:30px;background:#fff0cf;color:#785827;padding:5px 10px;font-size:.81rem;font-weight:800}.center{max-width:520px;margin:8vh auto}.code{font-family:ui-monospace,monospace;word-break:break-all;background:#fff5e1;padding:10px;border-radius:8px}.hide{display:none!important}.mobile-nav{display:none}@media(max-width:700px){.shell{display:block}aside{padding:15px 18px;border-right:0;border-bottom:1px solid #f0e5d1}.nav{display:none}main{padding:23px 16px 92px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-around;background:#fffdf8;border-top:1px solid #e9dac0;padding:7px}.mobile-nav button{border:0;background:transparent;color:#705938;padding:10px 6px;font-weight:700}.subgrid{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><b>✚</b>우리 구역</div>
    <div class="small" style="margin:9px 4px">예배와 기도</div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main>
    <header>
      <div>
        <div class="eyebrow" id="weekLabel"></div>
        <h1 id="heading">우리 구역</h1>
      </div>
      <button id="account" class="ghost hide">로그아웃</button>
    </header>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="root">
      <section class="card center">불러오는 중입니다.</section>
    </div>
  </main>
  <div id="mobileNav" class="mobile-nav hide"></div>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore, doc, collection, getDoc, setDoc, addDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, writeBatch} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyDrh2v8hqgrGaF8fOn0xisMLH8GfW2oozc',
  authDomain: 'my-prays.firebaseapp.com',
  projectId: 'my-prays',
  storageBucket: 'my-prays.firebasestorage.app',
  messagingSenderId: '600533778849',
  appId: '1:600533778849:web:2bf255d39ad652fe144be0'
});

const auth = getAuth(app);
const db = getFirestore(app);
const district = 'songtan-01';

const svc = [
  ['sunday1', '1부'],
  ['sunday2', '2부'],
  ['afternoon', '오후'],
  ['wednesday', '수요'],
  ['friday', '금요'],
  ['district', '구역'],
  ['monthly', '월삭']
];
const reasons = ['개인사정', '건강', '여행', '직장', '장기결석', '기타'];
const $ = function(id) { return document.getElementById(id); };
const esc = function(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c];
  });
};

const now = new Date();
const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7);
const week = [mon.getFullYear(), String(mon.getMonth() + 1).padStart(2, '0'), String(mon.getDate()).padStart(2, '0')].join('-');

let user = null, member = null, members = [], attendance = {}, prayers = [], prayed = {}, page = 'home', listeners = [], memberUnsub = null, watched = new Set(), busy = false, requests = [], invites = [], myRequest = null;

const memberRef = function(uid) { return doc(db, 'districts', district, 'members', uid); };
const attRef = function(uid) { return doc(db, 'districts', district, 'weeks', week, 'attendance', uid); };
const prayerRef = function(id) { return doc(db, 'districts', district, 'prayers', id); };
const prayRef = function(id) { return doc(db, 'districts', district, 'prayers', id, 'prayedBy', user.uid); };

const blank = function(uid) {
  return { uid: uid, services: Object.fromEntries(svc.map(function(k) { return [k[0], false]; })), dawn: 0, sundayAbsenceReason: '' };
};

function flash(msg, bad) {
  let isBad = bad ? true : false;
  let msgElem = $('message');
  if (msgElem) {
    msgElem.innerHTML = '<div class="notice ' + (isBad ? 'error' : '') + '">' + esc(msg) + '</div>';
    setTimeout(function() {
      if ($('message')) $('message').innerHTML = '';
    }, 6000);
  }
}

function fail(e) {
  console.error(e);
  let errMsg = '처리하지 못했어요. 잠시 후 다시 시도해주세요.';
  if (e.code === 'auth/unauthorized-domain') {
    errMsg = 'Firebase 인증에 이 사이트 주소를 승인된 도메인으로 추가해야 해요.';
  } else if (e.code === 'permission-denied') {
    errMsg = '접근 권한이 없습니다. 구역원 등록을 확인해주세요.';
  }
  flash(errMsg, true);
}

function stop() {
  listeners.forEach(function(f) { f(); });
  listeners = [];
  watched.clear();
  prayed = {};
}

function nav() {
  let tabs = [['home', '내 출석'], ['prayers', '함께 기도'], ['form', '기도 등록']];
  if (member && member.role === 'leader') {
    tabs.splice(1, 0, ['manage', '구역원 출석'], ['join', '가입 관리']);
  }
  ['nav', 'mobileNav'].forEach(function(id) {
    let container = $(id);
    if (!container) return;
    container.innerHTML = tabs.map(function(t) {
      let k = t[0], v = t[1];
      let activeClass = (page === k) ? 'active' : '';
      return '<button data-page="' + k + '" class="' + activeClass + '">' + v + '</button>';
    }).join('');
    container.classList.toggle('hide', !member);
  });
}

function draw() {
  if ((page === 'manage' || page === 'join') && (!member || member.role !== 'leader')) {
    page = 'home';
  }
  nav();
  let weekLabelElem = $('weekLabel');
  if (weekLabelElem) {
    weekLabelElem.textContent = member ? (mon.getMonth() + 1) + '월 ' + mon.getDate() + '일 주간' : '';
  }
  let headingElem = $('heading');
  if (headingElem) {
    if (!member) {
      headingElem.textContent = '우리 구역';
    } else {
      if (page === 'home') headingElem.textContent = '이번 주 나의 출석';
      else if (page === 'manage') headingElem.textContent = '구역원 출석';
      else if (page === 'join') headingElem.textContent = '가입 관리';
      else if (page === 'prayers') headingElem.textContent = '함께 기도해요';
      else if (page === 'form') headingElem.textContent = '기도제목 등록';
      else headingElem.textContent = '우리 구역';
    }
  }
  let accountElem = $('account');
  if (accountElem) {
    accountElem.classList.toggle('hide', !user);
  }

  let rootElem = $('root');
  if (!rootElem) return;

  if (!user) {
    rootElem.innerHTML = '<section class="card warm center"><div class="eyebrow">우리 구역만 함께 기록해요</div><h1>예배와 기도를 나눠요</h1><p class="muted">Google 계정으로 로그인하면 본인의 출석을 체크할 수 있습니다.</p><button class="primary" id="login">Google로 로그인</button></section>';
    return;
  }
  if (!member) {
    if (headingElem) headingElem.textContent = '구역원 가입';
    if (myRequest) {
      rootElem.innerHTML = '<section class="card center"><h2>가입 요청을 보냈어요</h2><p class="muted">구역장이 승인하면 이 화면에서 바로 출석을 기록할 수 있어요.</p><p class="small">요청 이름: ' + esc(myRequest.name) + '</p></section>';
    } else {
      rootElem.innerHTML = '<form class="card center" id="joinForm"><h2>우리 구역 가입 요청</h2><p class="muted">구역장에게 받은 참여코드를 입력하세요. 구역장 승인 후 이용할 수 있어요.</p><label class="field">이름<input name="name" maxlength="40" required autocomplete="name"></label><label class="field">참여코드<input name="code" required autocomplete="off" spellcheck="false"></label><button class="primary" type="submit">가입 요청</button></form>';
    }
    return;
  }
  
  if (page === 'home') rootElem.innerHTML = home();
  else if (page === 'manage') rootElem.innerHTML = manage();
  else if (page === 'join') rootElem.innerHTML = joinManage();
  else if (page === 'prayers') rootElem.innerHTML = prayerList();
  else if (page === 'form') rootElem.innerHTML = form();
  else rootElem.innerHTML = home();
}

function joinManage() {
  let invitesHtml = invites.map(function(x) {
    return '<div class="row" style="margin-top:12px"><span class="code">' + esc(x.id) + '</span><button class="secondary" data-copy-code="' + esc(x.id) + '">복사</button><button class="ghost" data-remove-code="' + esc(x.id) + '">코드 폐기</button></div>';
  }).join('');

  let requestsHtml = requests.map(function(r) {
    return '<div class="person"><strong>' + esc(r.name) + '</strong><div class="row"><button class="primary" data-approve="' + esc(r.uid) + '">구역원으로 승인</button><button class="ghost" data-reject="' + esc(r.uid) + '">거절</button></div></div>';
  }).join('');
  if (!requestsHtml) requestsHtml = '<p class="muted">대기 중인 요청이 없어요.</p>';

  let membersHtml = members.map(function(m) {
    let mName = m.name ? m.name : '구역원';
    let mRoleText = (m.role === 'leader') ? '구역장' : '구역원';
    let promoteBtn = (m.role === 'member') ? '<button class="secondary" data-promote="' + esc(m.uid) + '">구역장 권한 주기</button>' : '';
    return '<div class="person row"><strong>' + esc(mName) + ' · ' + mRoleText + '</strong>' + promoteBtn + '</div>';
  }).join('');

  return '<section class="card warm"><h2>구역원 가입</h2><p class="muted">참여코드를 전달받은 사람이 가입을 요청하면 이곳에서 승인하세요.</p><button class="primary" id="newCode">새 참여코드 만들기</button>' + invitesHtml + '</section><section class="card"><h2>가입 요청</h2>' + requestsHtml + '</section><section class="card"><h2>구역장 권한</h2><p class="small">구역원을 승인한 뒤 필요할 때 구역장 권한을 줄 수 있어요.</p>' + membersHtml + '</section>';
}

function checks(r, uid) {
  return '<div class="week-grid">' + svc.map(function(item) {
    let k = item[0], label = item[1];
    let servicesObj = r.services ? r.services : {};
    let isOn = !!servicesObj[k];
    let checkClass = isOn ? 'check on' : 'check';
    let checkMark = isOn ? ' ✓' : '';
    return '<button type="button" class="' + checkClass + '" data-uid="' + esc(uid) + '" data-attend="' + k + '" aria-pressed="' + isOn + '">' + label + checkMark + '</button>';
  }).join('') + '</div>';
}

function fields(r, uid) {
  let own = (uid === user.uid && page === 'home');
  let dawnVal = (r.dawn !== undefined && r.dawn !== null) ? r.dawn : 0;
  let currentReason = r.sundayAbsenceReason ? r.sundayAbsenceReason : '';
  
  let reasonsOpts = reasons.map(function(x) {
    let sel = (currentReason === x) ? 'selected' : '';
    return '<option ' + sel + '>' + x + '</option>';
  }).join('');

  let html = '<div class="subgrid"><label class="field">새벽예배 (주 7회까지)<input class="number" type="number" min="0" max="7" data-dawn="' + esc(uid) + '" value="' + dawnVal + '"></label><label class="field">주일예배 결석 사유<select data-reason="' + esc(uid) + '"><option value="">없음</option>' + reasonsOpts + '</select></label></div>';
  if (own) {
    html += '<p class="small">주일예배에 참석했다면 결석 사유는 비워주세요.</p>';
  }
  return html;
}

function home() {
  let r = attendance[user.uid] || blank(user.uid);
  let userName = (member && member.name) ? member.name : (user.displayName ? user.displayName : '구역원');
  let count = 0;
  if (r.services) {
    svc.forEach(function(item) {
      if (r.services[item[0]]) count++;
    });
  }
  let dawnVal = (r.dawn !== undefined && r.dawn !== null) ? r.dawn : 0;
  return '<section class="card warm"><div class="eyebrow">' + esc(userName) + '님의 기록</div><h2 style="margin:9px 0">이번 주 예배를 체크해요</h2><div class="small">참석한 예배를 누르세요. 다시 누르면 해제됩니다.</div></section><section class="card"><h2>이번 주 출석</h2>' + checks(r, user.uid) + fields(r, user.uid) + '</section><section class="card"><h2>이번 주 기록</h2><div class="row"><span>예배 출석 ' + count + '개</span><strong>새벽예배 ' + dawnVal + '회</strong></div></section>';
}

function manage() {
  let membersCards = members.map(function(m) {
    let r = attendance[m.uid] || blank(m.uid);
    let mName = m.name ? m.name : '구역원';
    return '<div class="person"><strong>' + esc(mName) + '</strong>' + checks(r, m.uid) + fields(r, m.uid) + '</div>';
  }).join('');
  if (!membersCards) membersCards = '<p class="muted">등록된 구역원이 없어요.</p>';

  return '<section class="card warm"><h2>한 화면에서 출석 확인</h2><p class="muted">구역원이 직접 체크한 내용도 여기 표시됩니다. 버튼을 다시 누르면 해제돼요.</p></section><section class="card">' + membersCards + '</section>';
}

function prayerList() {
  let list = prayers.filter(function(p) {
    return p.visibility === 'district' || p.authorUid === user.uid || (member && member.role === 'leader');
  });

  let itemsHtml = list.map(function(p) {
    let authorObj = members.find(function(m) { return m.uid === p.authorUid; });
    let authorName = (authorObj && authorObj.name) ? authorObj.name : '구역원';
    let tagText = (p.visibility === 'district') ? '우리 구역' : '중보기도팀 전달 요청';
    
    let actionBtn = '';
    if (p.visibility === 'district') {
      let pObj = prayed[p.id] || {};
      let isMine = !!pObj.mine;
      let cnt = pObj.count ? pObj.count : 0;
      let btnText = isMine ? '기도 표시 취소' : '함께 기도해요';
      actionBtn = '<button class="secondary" data-pray="' + esc(p.id) + '" aria-pressed="' + isMine + '">🙏 ' + btnText + ' · ' + cnt + '</button>';
    } else {
      actionBtn = '<span class="small">현재 구역장에게만 보이는 요청</span>';
    }

    return '<article class="prayer"><span class="tag">' + tagText + '</span><div class="small" style="margin-top:10px">' + esc(authorName) + '</div><h3>' + esc(p.title) + '</h3><p>' + esc(p.body) + '</p>' + actionBtn + '</article>';
  }).join('');
  if (!itemsHtml) itemsHtml = '<p class="muted">아직 등록된 기도제목이 없어요.</p>';

  return '<section class="card warm"><div class="row"><div><h2>함께 기도해요</h2><span class="small">한 사람당 한 번 · 다시 누르면 취소</span></div><button class="primary" data-page="form">기도제목 쓰기</button></div></section><section class="card">' + itemsHtml + '</section>';
}

function form() {
  return '<form class="card" id="prayerForm"><h2>기도제목 등록</h2><label class="field">제목<input name="title" maxlength="60" required></label><label class="field">내용<textarea name="body" maxlength="2000" required></textarea></label><label class="field">공유 범위<select name="visibility"><option value="district">우리 구역에 공유</option><option value="intercession">중보기도팀 전달 요청 (구역장만 확인하기)</option></select></label><p class="small">요청은 구역장에게만 보입니다. 구역장이 직접 중보기도팀에 전달합니다.</p><div class="row"><button type="button" class="secondary" data-page="prayers">취소</button><button class="primary" type="submit">등록</button></div></form>';
}

async function saveAttendance(uid, edit) {
  if (busy) return;
  busy = true;
  try {
    let r = JSON.parse(JSON.stringify(attendance[uid] || blank(uid)));
    edit(r);
    if (r.services.sunday1 || r.services.sunday2 || r.services.afternoon) {
      r.sundayAbsenceReason = '';
    }
    await setDoc(attRef(uid), r);
    attendance[uid] = r;
    draw();
  } catch (e) {
    fail(e);
    draw();
  } finally {
    busy = false;
  }
}

function watchAttendance(uid) {
  if (watched.has(uid)) return;
  watched.add(uid);
  listeners.push(onSnapshot(attRef(uid), function(s) {
    attendance[uid] = s.exists() ? s.data() : blank(uid);
    if (page === 'home' || page === 'manage') draw();
  }, fail));
}

function watchReactions(p) {
  if (p.visibility !== 'district' || watched.has('p:' + p.id)) return;
  watched.add('p:' + p.id);
  listeners.push(onSnapshot(collection(db, 'districts', district, 'prayers', p.id, 'prayedBy'), function(s) {
    prayed[p.id] = { count: s.size, mine: s.docs.some(function(d) { return d.id === user.uid; }) };
    if (page === 'prayers') draw();
  }, fail));
}

function watchData() {
  stop();
  attendance = {};
  prayers = [];
  if (member && member.role === 'leader') {
    listeners.push(onSnapshot(collection(db, 'districts', district, 'members'), function(s) {
      members = s.docs.map(function(d) { return Object.assign({ uid: d.id }, d.data()); });
      members.forEach(function(m) { watchAttendance(m.uid); });
      draw();
    }, fail));
    listeners.push(onSnapshot(collection(db, 'districts', district, 'joinRequests'), function(s) {
      requests = s.docs.map(function(d) { return Object.assign({ uid: d.id }, d.data()); });
      if (page === 'join') draw();
    }, fail));
    listeners.push(onSnapshot(collection(db, 'districts', district, 'invites'), function(s) {
      invites = s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      if (page === 'join') draw();
    }, fail));
  } else {
    members = [Object.assign({ uid: user.uid }, member)];
    watchAttendance(user.uid);
  }
  listeners.push(onSnapshot(query(collection(db, 'districts', district, 'prayers'), where('visibility', '==', 'district')), function(s) {
    prayers = prayers.filter(function(p) { return p.visibility !== 'district'; }).concat(s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }));
    prayers.forEach(watchReactions);
    if (page === 'prayers') draw();
  }, fail));
  if (member && member.role === 'leader') {
    listeners.push(onSnapshot(query(collection(db, 'districts', district, 'prayers'), where('visibility', '==', 'intercession')), function(s) {
      prayers = prayers.filter(function(p) { return p.visibility !== 'intercession'; }).concat(s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }));
      if (page === 'prayers') draw();
    }, fail));
  } else {
    listeners.push(onSnapshot(query(collection(db, 'districts', district, 'prayers'), where('authorUid', '==', user.uid)), function(s) {
      let own = s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      prayers = prayers.filter(function(p) { return p.visibility === 'district' || p.authorUid !== user.uid; }).concat(own.filter(function(p) { return p.visibility === 'intercession'; }));
      if (page === 'prayers') draw();
    }, fail));
  }
}

resetAuth();
function resetAuth() {
  onAuthStateChanged(auth, function(u) {
    stop();
    if (memberUnsub) {
      memberUnsub();
      memberUnsub = null;
    }
    user = u;
    member = null;
    myRequest = null;
    members = [];
    attendance = {};
    prayers = [];
    draw();
    if (!u) return;
    memberUnsub = onSnapshot(memberRef(u.uid), function(s) {
      let was = !!member;
      member = s.exists() ? s.data() : null;
      if (member) {
        if (!was) watchData();
        else draw();
      } else if (was || listeners.length === 0) {
        stop();
        listeners.push(onSnapshot(doc(db, 'districts', district, 'joinRequests', u.uid), function(r) {
          myRequest = r.exists() ? r.data() : null;
          draw();
        }, fail));
        draw();
      }
    }, fail);
  });
}

document.addEventListener('click', async function(e) {
  let t = e.target.closest('button');
  if (!t) return;
  if (t.id === 'login') {
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (err) {
      if (err.code !== 'auth/popup-closed-by-user') fail(err);
    }
    return;
  }
  if (t.id === 'account') {
    await signOut(auth);
    return;
  }
  if (t.id === 'newCode') {
    t.disabled = true;
    try {
      let code = crypto.randomUUID();
      await setDoc(doc(db, 'districts', district, 'invites', code), { createdBy: user.uid, createdAt: serverTimestamp() });
      flash('참여코드를 만들었어요. 복사해서 구역원에게 전달하세요.');
    } catch (err) {
      fail(err);
    } finally {
      t.disabled = false;
    }
    return;
  }
  if (t.dataset.copyCode) {
    try {
      await navigator.clipboard.writeText(t.dataset.copyCode);
      flash('참여코드를 복사했어요.');
    } catch (err) {
      fail(err);
    }
    return;
  }
  if (t.dataset.removeCode) {
    try {
      await deleteDoc(doc(db, 'districts', district, 'invites', t.dataset.removeCode));
      flash('참여코드를 폐기했어요.');
    } catch (err) {
      fail(err);
    }
    return;
  }
  if (t.dataset.approve) {
    t.disabled = true;
    try {
      let r = requests.find(function(x) { return x.uid === t.dataset.approve; });
      if (!r) throw Error('요청이 없습니다');
      let b = writeBatch(db);
      b.set(memberRef(r.uid), { name: r.name, role: 'member' });
      b.delete(doc(db, 'districts', district, 'joinRequests', r.uid));
      await b.commit();
      flash(r.name + '님을 구역원으로 승인했어요.');
    } catch (err) {
      fail(err);
    } finally {
      t.disabled = false;
    }
    return;
  }
  if (t.dataset.promote) {
    let m = members.find(function(x) { return x.uid === t.dataset.promote; });
    if (!m || m.role !== 'member') return;
    if (!confirm(m.name + '님에게 구역장 권한을 줄까요?')) return;
    t.disabled = true;
    try {
      let docRef = memberRef(m.uid);
      await setDoc(docRef, { role: 'leader' }, { merge: true });
      flash(m.name + '님에게 구역장 권한을 주었어요.');
    } catch (err) {
      fail(err);
    } finally {
      t.disabled = false;
    }
    return;
  }
  if (t.dataset.reject) {
    try {
      await deleteDoc(doc(db, 'districts', district, 'joinRequests', t.dataset.reject));
      flash('가입 요청을 거절했어요.');
    } catch (err) {
      fail(err);
    }
    return;
  }
  if (t.dataset.page) {
    page = t.dataset.page;
    draw();
    return;
  }
  if (t.dataset.attend) {
    saveAttendance(t.dataset.uid, function(r) {
      r.services[t.dataset.attend] = !r.services[t.dataset.attend];
    });
    return;
  }
  if (t.dataset.pray) {
    try {
      let r = prayRef(t.dataset.pray);
      let pObj = prayed[t.dataset.pray] || {};
      if (pObj.mine) await deleteDoc(r);
      else await setDoc(r, { prayedAt: serverTimestamp() });
    } catch (err) {
      fail(err);
    }
  }
});

document.addEventListener('change', function(e) {
  let t = e.target;
  if (t.dataset.dawn) {
    saveAttendance(t.dataset.dawn, function(r) {
      r.dawn = Math.max(0, Math.min(7, Math.trunc(Number(t.value) || 0)));
    });
  }
  if (t.dataset.reason) {
    saveAttendance(t.dataset.reason, function(r) {
      r.sundayAbsenceReason = t.value;
    });
  }
});

document.addEventListener('submit', async function(e) {
  if (e.target.id === 'joinForm') {
    e.preventDefault();
    let f = new FormData(e.target);
    let name = String(f.get('name') || '').trim();
    let code = String(f.get('code') || '').trim();
    if (!name || name.length > 40 || !code) return;
    let b = e.target.querySelector('[type=submit]');
    b.disabled = true;
    try {
      await setDoc(doc(db, 'districts', district, 'joinRequests', user.uid), { name, code, uid: user.uid, requestedAt: serverTimestamp() });
      flash('가입 요청을 보냈어요.');
    } catch (err) {
      fail(err);
      b.disabled = false;
    }
    return;
  }
  if (e.target.id !== 'prayerForm') return;
  e.preventDefault();
  let f = new FormData(e.target);
  let title = String(f.get('title') || '').trim();
  let body = String(f.get('body') || '').trim();
  if (!title || !body) return;
  let b = e.target.querySelector('[type=submit]');
  b.disabled = true;
  try {
    await addDoc(collection(db, 'districts', district, 'prayers'), { authorUid: user.uid, title, body, visibility: f.get('visibility'), createdAt: serverTimestamp() });
    page = 'prayers';
    draw();
    flash('기도제목을 등록했어요.');
  } catch (err) {
    fail(err);
    b.disabled = false;
  }
});

draw();
</script>
