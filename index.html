<script type="module">
    import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
    import{getFirestore,doc,collection,getDoc,setDoc,addDoc,deleteDoc,onSnapshot,query,where,serverTimestamp,writeBatch}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
    
    const app=initializeApp({apiKey:'AIzaSyDrh2v8hqgrGaF8fOn0xisMLH8GfW2oozc',authDomain:'my-prays.firebaseapp.com',projectId:'my-prays',storageBucket:'my-prays.firebasestorage.app',messagingSenderId:'600533778849',appId:'1:600533778849:web:2bf255d39ad652fe144be0'}),auth=getAuth(app),db=getFirestore(app),district='songtan-01';
    const svc=[['sunday1','1부'],['sunday2','2부'],['afternoon','오후'],['wednesday','수요'],['friday','금요'],['district','구역'],['monthly','월삭']],reasons=['개인사정','건강','여행','직장','장기결석','기타'];
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));
    const now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(now.getDay()+6)%7),week=[mon.getFullYear(),String(mon.getMonth()+1).padStart(2,'0'),String(mon.getDate()).padStart(2,'0')].join('-');
    
    let user=null,member=null,members=[],attendance={},prayers=[],prayed={},page='home',listeners=[],memberUnsub=null,watched=new Set(),busy=false,requests=[],invites=[],myRequest=null;
    
    const memberRef=uid=>doc(db,'districts',district,'members',uid),attRef=uid=>doc(db,'districts',district,'weeks',week,'attendance',uid),prayerRef=id=>doc(db,'districts',district,'prayers',id),prayRef=id=>doc(db,'districts',district,'prayers',id,'prayedBy',user.uid);
    const blank=uid=>({uid,services:Object.fromEntries(svc.map(([k])=>[k,false])),dawn:0,sundayAbsenceReason:''});
    
    function flash(msg,bad=false){$('message').innerHTML=`<div class="notice ${bad?'error':''}">${esc(msg)}</div>`;setTimeout(()=>{if($('message'))$('message').innerHTML=''},6000)}
    function fail(e){console.error(e);flash(e.code==='auth/unauthorized-domain'?'Firebase 인증에 이 사이트 주소를 승인된 도메인으로 추가해야 해요.':e.code==='permission-denied'?'접근 권한이 없습니다. 구역원 등록을 확인해주세요.':'처리하지 못했어요. 잠시 후 다시 시도해주세요.',true)}
    function stop(){listeners.forEach(f=>f());listeners=[];watched.clear();prayed={}}
    function nav(){let tabs=[['home','내 출석'],['prayers','함께 기도'],['form','기도 등록']];if(member?.role==='leader')tabs.splice(1,0,['manage','구역원 출석'],['join','가입 관리']);for(let id of ['nav','mobileNav']){$(id).innerHTML=tabs.map(([k,v])=>`<button data-page="${k}" class="${page===k?'active':''}">${v}</button>`).join('');$(id).classList.toggle('hide',!member)}}
    function draw(){if((page==='manage'||page==='join')&&member?.role!=='leader')page='home';nav();$('weekLabel').textContent=member?`${mon.getMonth()+1}월 ${mon.getDate()}일 주간`:'';$('heading').textContent=member?({home:'이번 주 나의 출석',manage:'구역원 출석',join:'가입 관리',prayers:'함께 기도해요',form:'기도제목 등록'})[page]:'우리 구역';$('account').classList.toggle('hide',!user);
    if(!user){$('root').innerHTML=`<section class="card warm center"><div class="eyebrow">우리 구역만 함께 기록해요</div><h1>예배와 기도를 나눠요</h1><p class="muted">Google 계정으로 로그인하면 본인의 출석을 체크할 수 있습니다.</p><button class="primary" id="login">Google로 로그인</button></section>`;return}
    if(!member){$('heading').textContent='구역원 가입';$('root').innerHTML=myRequest?`<section class="card center"><h2>가입 요청을 보냈어요</h2><p class="muted">구역장이 승인하면 이 화면에서 바로 출석을 기록할 수 있어요.</p><p class="small">요청 이름: ${esc(myRequest.name)}</p></section>`:`<form class="card center" id="joinForm"><h2>우리 구역 가입 요청</h2><p class="muted">구역장에게 받은 참여코드를 입력하세요. 구역장 승인 후 이용할 수 있어요.</p><label class="field">이름<input name="name" maxlength="40" required autocomplete="name"></label><label class="field">참여코드<input name="code" required autocomplete="off" spellcheck="false"></label><button class="primary" type="submit">가입 요청</button></form>`;return}
    $('root').innerHTML=({home:home,manage:manage,join:joinManage,prayers:prayerList,form:form})[page]()}
    
    function joinManage(){return `<section class="card warm"><h2>구역원 가입</h2><p class="muted">참여코드를 전달받은 사람이 가입을 요청하면 이곳에서 승인하세요.</p><button class="primary" id="newCode">새 참여코드 만들기</button>${invites.map(x=>`<div class="row" style="margin-top:12px"><span class="code">${esc(x.id)}</span><button class="secondary" data-copy-code="${esc(x.id)}">복사</button><button class="ghost" data-remove-code="${esc(x.id)}">코드 폐기</button></div>`).join('')}</section><section class="card"><h2>가입 요청</h2>${requests.map(r=>`<div class="person"><strong>${esc(r.name)}</strong><div class="row"><button class="primary" data-approve="${esc(r.uid)}">구역원으로 승인</button><button class="ghost" data-reject="${esc(r.uid)}">거절</button></div></div>`).join('')||'<p class="muted">대기 중인 요청이 없어요.</p>'}</section><section class="card"><h2>구역장 권한</h2><p class="small">구역원을 승인한 뒤 필요할 때 구역장 권한을 줄 수 있어요.</p>${members.map(m=>`<div class="person row"><strong>${esc(m.name||'구역원')} · ${m.role==='leader'?'구역장':'구역원'}</strong>${m.role==='member'? `<button class="secondary" data-promote="${esc(m.uid)}">구역장 권한 주기</button>`:''}</div>`).join('')}</section>`}
    function checks(r,uid){return `<div class="week-grid">${svc.map(([k,label])=>`<button type="button" class="check ${r.services?.[k]?'on':''}" data-uid="${esc(uid)}" data-attend="${k}" aria-pressed="${!!r.services?.[k]}">${label}${r.services?.[k]?' ✓':''}</button>`).join('')}</div>`}
    function fields(r,uid){let own=uid===user.uid&&page==='home';return `<div class="subgrid"><label class="field">새벽예배 (주 7회까지)<input class="number" type="number" min="0" max="7" data-dawn="${esc(uid)}" value="${r.dawn??0}"></label><label class="field">주일예배 결석 사유<select data-reason="${esc(uid)}"><option value="">없음</option>${reasons.map(x=>`<option ${r.sundayAbsenceReason===x?'selected':''}>${x}</option>`).join('')}</select></label></div>${own?'<p class="small">주일예배에 참석했다면 결석 사유는 비워주세요.</p>':''}`}
    function home(){let r=attendance[user.uid]||blank(user.uid),n=svc.filter(([k])=>r.services?.[k]).length;return `<section class="card warm"><div class="eyebrow">${esc(member.name||user.displayName||'구역원')}님의 기록</div><h2 style="margin:9px 0">이번 주 예배를 체크해요</h2><div class="small">참석한 예배를 누르세요. 다시 누르면 해제됩니다.</div></section><section class="card"><h2>이번 주 출석</h2>${checks(r,user.uid)}${fields(r,user.uid)}</section><section class="card"><h2>이번 주 기록</h2><div class="row"><span>예배 출석 ${n}개</span><strong>새벽예배 ${r.dawn??0}회</strong></div></section>`}
    function manage(){return `<section class="card warm"><h2>한 화면에서 출석 확인</h2><p class="muted">구역원이 직접 체크한 내용도 여기 표시됩니다. 버튼을 다시 누르면 해제돼요.</p></section><section class="card">${members.map(m=>{let r=attendance[m.uid]||blank(m.uid);return `<div class="person"><strong>${esc(m.name||'구역원')}</strong>${checks(r,m.uid)}${fields(r,m.uid)}</div>`}).join('')||'<p class="muted">등록된 구역원이 없어요.</p>'}</section>`}
    function prayerList(){let list=prayers.filter(p=>p.visibility==='district'||p.authorUid===user.uid||member.role==='leader');return `<section class="card warm"><div class="row"><div><h2>함께 기도해요</h2><span class="small">한 사람당 한 번 · 다시 누르면 취소</span></div><button class="primary" data-page="form">기도제목 쓰기</button></div></section><section class="card">${list.map(p=>`<article class="prayer"><span class="tag">${p.visibility==='district'?'우리 구역':'중보기도팀 전달 요청'}</span><div class="small" style="margin-top:10px">${esc(members.find(m=>m.uid===p.authorUid)?.name\vert{}\vert{}'구역원')}</div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${p.visibility==='district'?`<button class="secondary" data-pray="${esc(p.id)}" aria-pressed="${!!prayed[p.id]?.mine}">🙏 ${prayed[p.id]?.mine?'기도 표시 취소':'함께 기도해요'} · ${prayed[p.id]?.count??0}</button>`:'<span class="small">현재 구역장에게만 보이는 요청</span>'}</article>`).join('')||'<p class="muted">아직 등록된 기도제목이 없어요.</p>'}</section>`}
    function form(){return `<form class="card" id="prayerForm"><h2>기도제목 등록</h2><label class="field">제목<input name="title" maxlength="60" required></label><label class="field">내용<textarea name="body" maxlength="2000" required></textarea></label><label class="field">공유 범위<select name="visibility"><option value="district">우리 구역에 공유</option><option value="intercession">중보기도팀 전달 요청 (구역장만 확인하기)</option></select></label><p class="small">요청은 구역장에게만 보입니다. 구역장이 직접 중보기도팀에 전달합니다.</p><div class="row"><button type="button" class="secondary" data-page="prayers">취소</button><button class="primary" type="submit">등록</button></div></form>`}
    
    async function saveAttendance(uid,edit){if(busy)return;busy=true;try{let r=structuredClone(attendance[uid]||blank(uid));edit(r);if(r.services.sunday1||r.services.sunday2||r.services.afternoon)r.sundayAbsenceReason='';await setDoc(attRef(uid),r);attendance[uid]=r;draw()}catch(e){fail(e);draw()}finally{busy=false}}
    function watchAttendance(uid){if(watched.has(uid))return;watched.add(uid);listeners.push(onSnapshot(attRef(uid),s=>{attendance[uid]=s.exists()?s.data():blank(uid);if(page==='home'||page==='manage')draw()},fail))}
    function watchReactions(p){if(p.visibility!=='district'||watched.has('p:'+p.id))return;watched.add('p:'+p.id);listeners.push(onSnapshot(collection(db,'districts',district,'prayers',p.id,'prayedBy'),s=>{prayed[p.id]={count:s.size,mine:s.docs.some(d=>d.id===user.uid)};if(page==='prayers')draw()},fail))}
    
    function watchData(){stop();attendance={};prayers=[];if(member.role==='leader'){listeners.push(onSnapshot(collection(db,'districts',district,'members'),s=>{members=s.docs.map(d=>({uid:d.id,...d.data()}));members.forEach(m=>watchAttendance(m.uid));draw()},fail));listeners.push(onSnapshot(collection(db,'districts',district,'joinRequests'),s=>{requests=s.docs.map(d=>({uid:d.id,...d.data()}));if(page==='join')draw()},fail));listeners.push(onSnapshot(collection(db,'districts',district,'invites'),s=>{invites=s.docs.map(d=>({id:d.id,...d.data()}));if(page==='join')draw()},fail))}else{members=[{uid:user.uid,...member}];watchAttendance(user.uid)}
    listeners.push(onSnapshot(query(collection(db,'districts',district,'prayers'),where('visibility','==','district')),s=>{prayers=prayers.filter(p=>p.visibility!=='district').concat(s.docs.map(d=>({id:d.id,...d.data()})));prayers.forEach(watchReactions);if(page==='prayers')draw()},fail));
    if(member.role==='leader')listeners.push(onSnapshot(query(collection(db,'districts',district,'prayers'),where('visibility','==','intercession')),s=>{prayers=prayers.filter(p=>p.visibility!=='intercession').concat(s.docs.map(d=>({id:d.id,...d.data()})));if(page==='prayers')draw()},fail));else listeners.push(onSnapshot(query(collection(db,'districts',district,'prayers'),where('authorUid','==',user.uid)),s=>{let own=s.docs.map(d=>({id:d.id,...d.data()}));prayers=prayers.filter(p=>p.visibility==='district'||p.authorUid!==user.uid).concat(own.filter(p=>p.visibility==='intercession'));if(page==='prayers')draw()},fail))}
    
    resetAuth();
    function resetAuth(){onAuthStateChanged(auth,u=>{stop();if(memberUnsub){memberUnsub();memberUnsub=null}user=u;member=null;myRequest=null;members=[];attendance={};prayers=[];draw();if(!u)return;memberUnsub=onSnapshot(memberRef(u.uid),s=>{let was=!!member;member=s.exists()?s.data():null;if(member){if(!was)watchData();else draw()}else if(was||listeners.length===0){stop();listeners.push(onSnapshot(doc(db,'districts',district,'joinRequests',u.uid),r=>{myRequest=r.exists()?r.data():null;draw()},fail));draw()}},fail)})}
    
    document.addEventListener('click',async e=>{let t=e.target.closest('button');if(!t)return;if(t.id==='login'){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(err){if(err.code!=='auth/popup-closed-by-user')fail(err)}return}if(t.id==='account'){await signOut(auth);return}if(t.id==='newCode'){t.disabled=true;try{let code=crypto.randomUUID();await setDoc(doc(db,'districts',district,'invites',code),{createdBy:user.uid,createdAt:serverTimestamp()});flash('참여코드를 만들었어요. 복사해서 구역원에게 전달하세요.')}catch(err){fail(err)}finally{t.disabled=false}return}if(t.dataset.copyCode){try{await navigator.clipboard.writeText(t.dataset.copyCode);flash('참여코드를 복사했어요.')}catch(err){fail(err)}return}if(t.dataset.removeCode){try{await deleteDoc(doc(db,'districts',district,'invites',t.dataset.removeCode));flash('참여코드를 폐기했어요.')}catch(err){fail(err)}return}if(t.dataset.approve){t.disabled=true;try{let r=requests.find(x=>x.uid===t.dataset.approve);if(!r)throw Error('요청이 없습니다');let b=writeBatch(db);b.set(memberRef(r.uid),{name:r.name,role:'member'});b.delete(doc(db,'districts',district,'joinRequests',r.uid));await b.commit();flash(r.name+'님을 구역원으로 승인했어요.')}catch(err){fail(err)}finally{t.disabled=false}return}if(t.dataset.promote){let m=members.find(x=>x.uid===t.dataset.promote);if(!m||m.role!=='member')return;if(!confirm(m.name+'님에게 구역장 권한을 줄까요?'))return;t.disabled=true;try{await setDoc(memberRef(m.uid),{role:'leader'},{merge:true});flash(m.name+'님에게 구역장 권한을 주었어요.')}catch(err){fail(err)}finally{t.disabled=false}return}if(t.dataset.reject){try{await deleteDoc(doc(db,'districts',district,'joinRequests',t.dataset.reject));flash('가입 요청을 거절했어요.')}catch(err){fail(err)}return}if(t.id==='copyUid'){try{await navigator.clipboard.writeText(user.uid);flash('회원 번호를 복사했어요.')}catch(err){fail(err)}return}if(t.dataset.page){page=t.dataset.page;draw();return}if(t.dataset.attend){saveAttendance(t.dataset.uid,r=>{r.services[t.dataset.attend]=!r.services[t.dataset.attend]});return}if(t.dataset.pray){try{let r=prayRef(t.dataset.pray);if(prayed[t.dataset.pray]?.mine)await deleteDoc(r);else await setDoc(r,{prayedAt:serverTimestamp()})}catch(err){fail(err)}}});
    
    document.addEventListener('change',e=>{let t=e.target;if(t.dataset.dawn)saveAttendance(t.dataset.dawn,r=>{r.dawn=Math.max(0,Math.min(7,Math.trunc(Number(t.value)||0)))});if(t.dataset.reason)saveAttendance(t.dataset.reason,r=>{r.sundayAbsenceReason=t.value})});
    
    document.addEventListener('submit',async e=>{if(e.target.id==='joinForm'){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),code=String(f.get('code')||'').trim();if(!name||name.length>40||!code)return;let b=e.target.querySelector('[type=submit]');b.disabled=true;try{await setDoc(doc(db,'districts',district,'joinRequests',user.uid),{name,code,uid:user.uid,requestedAt:serverTimestamp()});flash('가입 요청을 보냈어요.')}catch(err){fail(err);b.disabled=false}return}if(e.target.id!=='prayerForm')return;e.preventDefault();let f=new FormData(e.target),title=String(f.get('title')||'').trim(),body=String(f.get('body')||'').trim();if(!title||!body)return;let b=e.target.querySelector('[type=submit]');b.disabled=true;try{await addDoc(collection(db,'districts',district,'prayers'),{authorUid:user.uid,title,body,visibility:f.get('visibility'),createdAt:serverTimestamp()});page='prayers';draw();flash('기도제목을 등록했어요.')}catch(err){fail(err);b.disabled=false}});
    
    draw();
</script>
