<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 소그룹 · 예배와 기도</title>
<meta name="description" content="소그룹 예배 출석과 기도제목을 함께 기록합니다">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d8a852'/%3E%3Cpath d='M32 12v40M20 25h24' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{font:16px system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#504434;background:#fffaf0}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9d763b;outline-offset:2px}.shell{max-width:1040px;margin:auto;min-height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr)}aside{padding:30px 18px;background:#fffdf8;border-right:1px solid #f0e5d1}.brand{font-size:1.24rem;font-weight:800}.brand b{display:inline-grid;place-items:center;background:#e8ba61;color:white;border-radius:10px;width:34px;height:34px;margin-right:8px}.small{font-size:.87rem;color:#766d60;line-height:1.5}.nav{display:grid;gap:6px;margin-top:34px}.nav button{border:0;text-align:left;background:transparent;color:#715b3c;padding:12px 13px;border-radius:12px;font-weight:700}.nav button.active{background:#fff0ce}main{padding:30px clamp(18px,5vw,48px) 90px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}h1{font-size:1.65rem;letter-spacing:-.05em;margin:4px 0}h2{font-size:1.17rem;margin:0 0 16px}h3{font-size:1rem}.eyebrow{font-size:.88rem;color:#93671e;font-weight:800}.card{background:#fff;border:1px solid #f0e3cb;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px #6445120e}.warm{background:#fff0c9}.muted{color:#766b5e;line-height:1.6}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.primary,.secondary,.ghost{border-radius:12px;font-weight:750;padding:10px 14px}.primary{background:#ae7d32;border:1px solid #ae7d32;color:white}.secondary{background:white;border:1px solid #d9c297;color:#715129}.ghost{border:0;background:transparent;color:#815c26}.week-grid{display:flex;flex-wrap:wrap;gap:8px}.check{border:1px solid #dccaaa;background:white;color:#645849;border-radius:11px;min-width:67px;padding:10px 13px;font-weight:750}.check.on{background:#f8dc94;border-color:#e8c566;color:#5c421b}.field{display:grid;gap:7px;margin:14px 0;color:#5d4c34;font-weight:700}.field input,.field textarea,.field select{border:1px solid #ddcaaa;border-radius:12px;padding:11px 13px;width:100%;background:#fff;color:#443b2e}.field textarea{min-height:110px;resize:vertical}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.number{max-width:115px}.notice{border-radius:13px;padding:12px 14px;background:#edf7e9;color:#47653c;margin-bottom:16px}.notice.error{background:#fff0e9;color:#984b36}.person,.prayer{border-top:1px solid #f0e5d3;padding:17px 0}.person:first-child,.prayer:first-child{border-top:0}.person strong{display:block;margin-bottom:12px}.prayer p{white-space:pre-wrap;line-height:1.6}.tag{border-radius:30px;background:#fff0cf;color:#785827;padding:5px 10px;font-size:.81rem;font-weight:800}.center{max-width:520px;margin:8vh auto}.code{font-family:ui-monospace,monospace;word-break:break-all;background:#fff5e1;padding:10px;border-radius:8px}.hide{display:none!important}.mobile-nav{display:none}@media(max-width:700px){.shell{display:block}aside{padding:15px 18px;border-right:0;border-bottom:1px solid #f0e5d1}.nav{display:none}main{padding:23px 16px 92px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-around;background:#fffdf8;border-top:1px solid #e9dac0;padding:7px}.mobile-nav button{border:0;background:transparent;color:#705938;padding:10px 6px;font-weight:700}.subgrid{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><b id="brandIcon">✚</b><span id="brandTitle">우리 소그룹</span></div>
    <div class="small" style="margin:9px 4px" id="brandSub">예배와 기도</div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main>
    <header>
      <div>
        <div class="row" style="gap:8px; margin-bottom:4px;">
          <div class="eyebrow" id="weekLabel"></div>
          <select id="weekSelector" class="hide" style="border:1px solid #dccaaa; border-radius:8px; padding:3px 6px; background:#fff; font-size:0.85rem; font-weight:700; color:#715b3c; cursor:pointer;"></select>
        </div>
        <h1 id="heading">우리 소그룹</h1>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="langToggle" class="secondary" style="padding:6px 10px; font-size:0.85rem; cursor:pointer;">English</button>
        <button id="account" class="ghost hide">로그아웃</button>
      </div>
    </header>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="root">
      <section class="card center" id="loadingText">불러오는 중입니다.</section>
    </div>
  </main>
  <div id="mobileNav" class="mobile-nav hide"></div>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore, doc, collection, getDoc, setDoc, addDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, writeBatch} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyDrh2v8hqgrGaF8fOn0xisMLH8GfW2oozc',
  authDomain: 'my-prays.firebaseapp.com',
  projectId: 'my-prays',
  storageBucket: 'my-prays.firebasestorage.app',
  messagingSenderId: '600533778849',
  appId: '1:600533778849:web:2bf255d39ad652fe144be0'
});

const auth = getAuth(app);
const db = getFirestore(app);
const district = 'songtan-01';

let currentLang = localStorage.getItem('app_lang') || 'ko';
let isEnglish = (currentLang === 'en');

const dict = {
  ko: {
    brandTitle: "우리 소그룹", brandSub: "예배와 기도",
    loading: "불러오는 중입니다.",
    logout: "로그아웃", loginBtn: "Google로 로그인",
    home: "내 출석", prayers: "함께 기도", form: "기도 등록", manage: "소그룹원 출석", join: "가입 관리",
    homeHeading: "나의 출석 기록", manageHeading: "소그룹원 출석 관리", joinHeading: "가입 관리", prayerHeading: "함께 기도해요", formHeading: "기도제목 등록", defaultHeading: "우리 소그룹",
    sunday1: "1부", sunday2: "2부", afternoon: "오후", wednesday: "수요일", friday: "금요일", district: "소그룹", monthly: "월삭",
    reasons: ['개인사정', '건강', '여행', '직장', '장기결석', '기타']
  },
  en: {
    brandTitle: "Cell Group", brandSub: "Worship & Prayer",
    loading: "Loading...",
    logout: "Sign Out", loginBtn: "Sign in with Google",
    home: "My Attendance", prayers: "Pray Together", form: "Add Prayer", manage: "Member Attendance", join: "Join Requests",
    homeHeading: "Attendance Record", manageHeading: "Member Attendance Management", joinHeading: "Manage Requests", prayerHeading: "Pray Together", formHeading: "New Prayer Request", defaultHeading: "Cell Group",
    sunday1: "1st Service", sunday2: "2nd Service", afternoon: "Afternoon", wednesday: "Wednesday", friday: "Friday", district: "Cell Group", monthly: "Monthly",
    reasons: ['Personal', 'Health', 'Travel', 'Work', 'Long-term Absence', 'Other']
  }
};
let t = dict[currentLang];

let svc = [];
function updateSvc() {
  t = dict[currentLang];
  svc = [
    ['sunday1', t.sunday1],
    ['sunday2', t.sunday2],
    ['afternoon', t.afternoon],
    ['wednesday', t.wednesday],
    ['friday', t.friday],
    ['district', t.district],
    ['monthly', t.monthly]
  ];
}
updateSvc();

const $ = function(id) { return document.getElementById(id); };
const esc = function(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c];
  });
};

const now = new Date();
const currentMon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7);
const weeksList = [];
for (let i = 0; i < 8; i++) {
  let d = new Date(currentMon.getFullYear(), currentMon.getMonth(), currentMon.getDate() - (i * 7));
  let wId = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
  let wLabel = isEnglish ? `${d.getMonth() + 1}/${d.getDate()} Week` : `${d.getMonth() + 1}월 ${d.getDate()}일 주간`;
  if (i === 0) wLabel += isEnglish ? " (This Week)" : " (이번 주)";
  weeksList.push({ id: wId, label: wLabel });
}

let selectedWeek = weeksList[0].id;
let weekMeta = { isClosed: false };

let user = null, member = null, memberLoaded = false, members = [], attendance = {}, prayers = [], prayed = {}, page = 'home', listeners = [], memberUnsub = null, metaUnsub = null, watched = new Set(), busy = false, requests = [], invites = [], myRequest = null;

const memberRef = function(uid) { return doc(db, 'districts', district, 'members', uid); };
const attRef = function(uid) { return doc(db, 'districts', district, 'weeks', selectedWeek, 'attendance', uid); };
const weekMetaRef = function() { return doc(db, 'districts', district, 'weeks', selectedWeek); };
const prayerRef = function(id) { return doc(db, 'districts', district, 'prayers', id); };
const prayRef = function(id) { return doc(db, 'districts', district, 'prayers', id, 'prayedBy', user.uid); };

const blank = function(uid) {
  return { uid: uid, services: Object.fromEntries(svc.map(function(k) { return [k[0], false]; })), dawn: 0, sundayAbsenceReason: '' };
};

function flash(msg, bad) {
  let isBad = bad ? true : false;
  let msgElem = $('message');
  if (msgElem) {
    msgElem.innerHTML = '<div class="notice ' + (isBad ? 'error' : '') + '">' + esc(msg) + '</div>';
    setTimeout(function() {
      if ($('message'))$('message').innerHTML = '';
    }, 6000);
  }
}

function fail(e) {
  console.error(e);
  let errMsg = isEnglish ? 'Failed to process. Please try again later.' : '처리하지 못했어요. 잠시 후 다시 시도해주세요.';
  if (e.code === 'permission-denied') {
    errMsg = isEnglish ? 'Access denied. This week may be closed or you lack permission.' : '접근 권한이 없거나 이미 마감된 주차입니다.';
  }
  flash(errMsg, true);
}

function stop() {
  listeners.forEach(function(f) { f(); });
  listeners = [];
  if (metaUnsub) { metaUnsub(); metaUnsub = null; }
  watched.clear();
  prayed = {};
}

function nav() {
  let tabs = [['home', t.home], ['prayers', t.prayers], ['form', t.form]];
  if (member && member.role === 'leader') {
    tabs.splice(1, 0, ['manage', t.manage], ['join', t.join]);
  }
  ['nav', 'mobileNav'].forEach(function(id) {
    let container = $(id);
    if (!container) return;
    container.innerHTML = tabs.map(function(item) {
      let k = item[0], v = item[1];
      let activeClass = (page === k) ? 'active' : '';
      return '<button data-page="' + k + '" class="' + activeClass + '">' + v + '</button>';
    }).join('');
    container.classList.toggle('hide', !member);
  });
}

function draw() {
  if ((page === 'manage' || page === 'join') && (!member || member.role !== 'leader')) {
    page = 'home';
  }
  updateSvc();
  nav();
  
  if ($('brandTitle'))$('brandTitle').textContent = t.brandTitle;
  if ($('brandSub'))$('brandSub').textContent = t.brandSub;
  if ($('loadingText'))$('loadingText').textContent = t.loading;
  if ($('account'))$('account').textContent = t.logout;
  if ($('langToggle'))$('langToggle').textContent = (currentLang === 'ko') ? 'English' : '한국어';

  let ws = $('weekSelector');
  if (ws) {
    if (member) {
      ws.innerHTML = weeksList.map(function(w) {
        return '<option value="' + w.id + '" ' + (w.id === selectedWeek ? 'selected' : '') + '>' + w.label + '</option>';
      }).join('');
      ws.classList.remove('hide');
    } else {
      ws.classList.add('hide');
    }
  }

  let weekLabelElem = $('weekLabel');
  if (weekLabelElem) {
    let currentWObj = weeksList.find(function(w) { return w.id === selectedWeek; });
    weekLabelElem.textContent = member && currentWObj ? currentWObj.label : '';
  }

  let headingElem = $('heading');
  if (headingElem) {
    if (!member) {
      headingElem.textContent = t.defaultHeading;
    } else {
      if (page === 'home') headingElem.textContent = t.homeHeading;
      else if (page === 'manage') headingElem.textContent = t.manageHeading;
      else if (page === 'join') headingElem.textContent = t.joinHeading;
      else if (page === 'prayers') headingElem.textContent = t.prayerHeading;
      else if (page === 'form') headingElem.textContent = t.formHeading;
      else headingElem.textContent = t.defaultHeading;
    }
  }
  
  let accountElem = $('account');
  if (accountElem) accountElem.classList.toggle('hide', !user);

  let rootElem = $('root');
  if (!rootElem) return;

  if (!user) {
    let loginCardTitle = isEnglish ? "Record Together as a Cell Group" : "우리 소그룹만 함께 기록해요";
    let loginCardHeader = isEnglish ? "Share Worship & Prayer" : "예배와 기도를 나눠요";
    let loginCardDesc = isEnglish ? "Sign in with your Google account to check your attendance." : "Google 계정으로 로그인하면 본인의 출석을 체크할 수 있습니다.";
    rootElem.innerHTML = '<section class="card warm center"><div class="eyebrow">' + loginCardTitle + '</div><h1>' + loginCardHeader + '</h1><p class="muted">' + loginCardDesc + '</p><button class="primary" id="login">' + t.loginBtn + '</button></section>';
    return;
  }

  // 멤버 정보가 아직 로딩 중일 때는 깜빡임이나 가입폼이 뜨지 않도록 로딩 표시
  if (!memberLoaded) {
    rootElem.innerHTML = '<section class="card center">' + t.loading + '</section>';
    return;
  }

  if (!member) {
    if (headingElem) headingElem.textContent = isEnglish ? "Cell Group Registration" : "소그룹원 가입";
    if (myRequest) {
      let reqTitle = isEnglish ? "Join Request Sent" : "가입 요청을 보냈어요";
      let reqDesc = isEnglish ? "Once the leader approves, you can record attendance right here." : "소그룹장이 승인하면 이 화면에서 바로 출석을 기록할 수 있어요.";
      let reqName = isEnglish ? "Requested Name: " : "요청 이름: ";
      rootElem.innerHTML = '<section class="card center"><h2>' + reqTitle + '</h2><p class="muted">' + reqDesc + '</p><p class="small">' + reqName + esc(myRequest.name) + '</p></section>';
    } else {
      let formTitle = isEnglish ? "Cell Group Join Request" : "우리 소그룹 가입 요청";
      let formDesc = isEnglish ? "Enter the participation code received from your leader. Available after approval." : "소그룹장에게 받은 참여코드를 입력하세요. 소그룹장 승인 후 이용할 수 있어요.";
      let nameLabel = isEnglish ? "Name" : "이름";
      let codeLabel = isEnglish ? "Participation Code" : "참여코드";
      let btnText = isEnglish ? "Request to Join" : "가입 요청";
      rootElem.innerHTML = '<form class="card center" id="joinForm"><h2>' + formTitle + '</h2><p class="muted">' + formDesc + '</p><label class="field">' + nameLabel + '<input name="name" maxlength="40" required autocomplete="name"></label><label class="field">' + codeLabel + '<input name="code" required autocomplete="off" spellcheck="false"></label><button class="primary" type="submit">' + btnText + '</button></form>';
    }
    return;
  }
  
  if (page === 'home') rootElem.innerHTML = home();
  else if (page === 'manage') rootElem.innerHTML = manage();
  else if (page === 'join') rootElem.innerHTML = joinManage();
  else if (page === 'prayers') rootElem.innerHTML = prayerList();
  else if (page === 'form') rootElem.innerHTML = form();
  else rootElem.innerHTML = home();
}

function joinManage() {
  let copyText = isEnglish ? "Copy" : "복사";
  let revokeText = isEnglish ? "Revoke Code" : "코드 폐기";
  let newCodeText = isEnglish ? "Create New Code" : "새 참여코드 만들기";
  let invitesHeader = isEnglish ? "Cell Group Join" : "소그룹원 가입";
  let invitesDesc = isEnglish ? "Approve members who request to join with the participation code." : "참여코드를 전달받은 사람이 가입을 요청하면 이곳에서 승인하세요.";
  let requestsHeader = isEnglish ? "Join Requests" : "가입 요청";
  let noReqText = isEnglish ? "No pending requests." : "대기 중인 요청이 없어요.";
  let approveText = isEnglish ? "Approve Member" : "소그룹원으로 승인";
  let rejectText = isEnglish ? "Reject" : "거절";
  let leaderPermHeader = isEnglish ? "Leader Permissions" : "소그룹장 권한";
  let leaderPermDesc = isEnglish ? "You can grant leader permissions after approving members." : "소그룹원을 승인한 뒤 필요할 때 소그룹장 권한을 줄 수 있어요.";
  let promoteText = isEnglish ? "Make Leader" : "소그룹장 권한 주기";
  let leaderText = isEnglish ? "Leader" : "소그룹장";
  let memberText = isEnglish ? "Member" : "소그룹원";

  let invitesHtml = invites.map(function(x) {
    return '<div class="row" style="margin-top:12px"><span class="code">' + esc(x.id) + '</span><button class="secondary" data-copy-code="' + esc(x.id) + '">' + copyText + '</button><button class="ghost" data-remove-code="' + esc(x.id) + '">' + revokeText + '</button></div>';
  }).join('');

  let requestsHtml = requests.map(function(r) {
    return '<div class="person"><strong>' + esc(r.name) + '</strong><div class="row"><button class="primary" data-approve="' + esc(r.uid) + '">' + approveText + '</button><button class="ghost" data-reject="' + esc(r.uid) + '">' + rejectText + '</button></div></div>';
  }).join('');
  if (!requestsHtml) requestsHtml = '<p class="muted">' + noReqText + '</p>';

  let membersHtml = members.map(function(m) {
    let mName = m.name ? m.name : memberText;
    let mRoleText = (m.role === 'leader') ? leaderText : memberText;
    let promoteBtn = (m.role === 'member') ? '<button class="secondary" data-promote="' + esc(m.uid) + '">' + promoteText + '</button>' : '';
    return '<div class="person row"><strong>' + esc(mName) + ' · ' + mRoleText + '</strong>' + promoteBtn + '</div>';
  }).join('');

  return '<section class="card warm"><h2>' + invitesHeader + '</h2><p class="muted">' + invitesDesc + '</p><button class="primary" id="newCode">' + newCodeText + '</button>' + invitesHtml + '</section><section class="card"><h2>' + requestsHeader + '</h2>' + requestsHtml + '</section><section class="card"><h2>' + leaderPermHeader + '</h2><p class="small">' + leaderPermDesc + '</p>' + membersHtml + '</section>';
}

function checks(r, uid) {
  let disabledAttr = (weekMeta.isClosed && member.role !== 'leader') ? 'disabled style="opacity:0.6; cursor:not-allowed;"' : '';
  return '<div class="week-grid">' + svc.map(function(item) {
    let k = item[0], label = item[1];
    let servicesObj = r.services ? r.services : {};
    let isOn = !!servicesObj[k];
    let checkClass = isOn ? 'check on' : 'check';
    let checkMark = isOn ? ' ✓' : '';
    return '<button type="button" class="' + checkClass + '" data-uid="' + esc(uid) + '" data-attend="' + k + '" aria-pressed="' + isOn + '" ' + disabledAttr + '>' + label + checkMark + '</button>';
  }).join('') + '</div>';
}

function fields(r, uid) {
  let own = (uid === user.uid && page === 'home');
  let dawnVal = (r.dawn !== undefined && r.dawn !== null) ? r.dawn : 0;
  let currentReason = r.sundayAbsenceReason ? r.sundayAbsenceReason : '';
  let disabledAttr = (weekMeta.isClosed && member.role !== 'leader') ? 'disabled' : '';
  
  let dawnLabel = isEnglish ? "Early Morning Prayer (up to 7/wk)" : "새벽예배 (주 7회까지)";
  let absLabel = isEnglish ? "Sunday Absence Reason" : "주일예배 결석 사유";
  let noneText = isEnglish ? "None" : "없음";
  let tipText = isEnglish ? "If you attended Sunday service, please leave the reason blank." : "주일예배에 참석했다면 결석 사유는 비워주세요.";

  let reasonsOpts = reasons.map(function(x, idx) {
    let originalKo = dict.ko.reasons[idx];
    let sel = (currentReason === originalKo || currentReason === x) ? 'selected' : '';
    return '<option value="' + originalKo + '" ' + sel + '>' + x + '</option>';
  }).join('');

  let html = '<div class="subgrid"><label class="field">' + dawnLabel + '<input class="number" type="number" min="0" max="7" data-dawn="' + esc(uid) + '" value="' + dawnVal + '" ' + disabledAttr + '></label><label class="field">' + absLabel + '<select data-reason="' + esc(uid) + '" ' + disabledAttr + '><option value="">' + noneText + '</option>' + reasonsOpts + '</select></label></div>';
  if (own) {
    html += '<p class="small">' + tipText + '</p>';
  }
  return html;
}

function getLeaderCloseBanner() {
  if (!member || member.role !== 'leader') return '';
  let isClosed = weekMeta.isClosed;
  let bannerBg = isClosed ? 'background:#fff0e9; border:1px solid #f5c2b8;' : 'background:#edf7e9; border:1px solid #c8e6c9;';
  let bannerText = isClosed 
    ? (isEnglish ? '🔒 This week is currently CLOSED for member edits.' : '🔒 현재 이 주차는 소그룹원 출석 수정이 마감된 상태입니다.')
    : (isEnglish ? '🟢 This week is OPEN for attendance recording.' : '🟢 현재 소그룹원들이 출석을 기록할 수 있는 열린 상태입니다.');
  let btnText = isClosed 
    ? (isEnglish ? 'Open Attendance' : '마감 해제하기') 
    : (isEnglish ? 'Close Attendance' : '이번 주 출석 마감하기');
  let btnClass = isClosed ? 'primary' : 'secondary';

  return '<div class="card" style="' + bannerBg + ' margin-bottom:16px;"><div class="row"><div><strong>' + bannerText + '</strong></div><button class="' + btnClass + '" id="toggleCloseWeek">' + btnText + '</button></div></div>';
}

function home() {
  let r = attendance[user.uid] || blank(user.uid);
  let userName = (member && member.name) ? member.name : (user.displayName ? user.displayName : (isEnglish ? 'Member' : '소그룹원'));
  let count = 0;
  if (r.services) {
    svc.forEach(function(item) {
      if (r.services[item[0]]) count++;
    });
  }
  let dawnVal = (r.dawn !== undefined && r.dawn !== null) ? r.dawn : 0;
  
  let titleSuffix = isEnglish ? "'s Record" : "님의 기록";
  let checkHeader = isEnglish ? "Check Your Worship This Week" : "이번 주 예배를 체크해요";
  let checkDesc = isEnglish ? "Tap the services you attended. Tap again to uncheck." : "참석한 예배를 누르세요. 다시 누르면 해제됩니다.";
  let attHeader = isEnglish ? "Attendance This Week" : "이번 주 출석";
  let recHeader = isEnglish ? "This Week's Record" : "이번 주 기록";
  let attCountText = isEnglish ? "Services: " : "예배 출석 ";
  let attCountSuffix = isEnglish ? "" : "개";
  let dawnCountText = isEnglish ? "Early Prayer: " : "새벽예배 ";
  let dawnCountSuffix = isEnglish ? " times" : "회";

  let closedNotice = (weekMeta.isClosed && member.role !== 'leader') 
    ? '<div class="notice error" style="margin-bottom:16px;">' + (isEnglish ? 'Attendance for this week is closed by the leader.' : '소그룹장에 의해 마감된 주차여서 출석 수정이 불가합니다.') + '</div>' 
    : '';

  return getLeaderCloseBanner() + closedNotice + '<section class="card warm"><div class="eyebrow">' + esc(userName) + titleSuffix + '</div><h2 style="margin:9px 0">' + checkHeader + '</h2><div class="small">' + checkDesc + '</div></section><section class="card"><h2>' + attHeader + '</h2>' + checks(r, user.uid) + fields(r, user.uid) + '</section><section class="card"><h2>' + recHeader + '</h2><div class="row"><span>' + attCountText + count + attCountSuffix + '</span><strong>' + dawnCountText + dawnVal + dawnCountSuffix + '</strong></div></section>';
}

function manage() {
  let noMemberText = isEnglish ? "No registered members." : "등록된 소그룹원이 없어요.";
  let manageHeader = isEnglish ? "Member Attendance Overview" : "한 화면에서 출석 확인";
  let manageDesc = isEnglish ? "Check-ins made by members directly will appear here. Tap buttons again to uncheck." : "소그룹원이 직접 체크한 내용도 여기 표시됩니다. 버튼을 다시 누르면 해제돼요.";

  let membersCards = members.map(function(m) {
    let r = attendance[m.uid] || blank(m.uid);
    let mName = m.name ? m.name : (isEnglish ? 'Member' : '소그룹원');
    return '<div class="person"><strong>' + esc(mName) + '</strong>' + checks(r, m.uid) + fields(r, m.uid) + '</div>';
  }).join('');
  if (!membersCards) membersCards = '<p class="muted">' + noMemberText + '</p>';

  return getLeaderCloseBanner() + '<section class="card warm"><h2>' + manageHeader + '</h2><p class="muted">' + manageDesc + '</p></section><section class="card">' + membersCards + '</section>';
}

function prayerList() {
  let list = prayers.filter(function(p) {
    return p.visibility === 'district' || p.authorUid === user.uid || (member && member.role === 'leader');
  });

  let noPrayerText = isEnglish ? "No prayer requests yet." : "아직 등록된 기도제목이 없어요.";
  let writeBtnText = isEnglish ? "Write Prayer" : "기도제목 쓰기";
  let tagCell = isEnglish ? "Cell Group" : "우리 소그룹";
  let tagIntercession = isEnglish ? "Intercession Team Request" : "중보기도팀 전달 요청";
  let prayBtnText = isEnglish ? "Praying Together" : "함께 기도해요";
  let cancelPrayText = isEnglish ? "Cancel Prayer" : "기도 표시 취소";
  let leaderOnlyText = isEnglish ? "Visible to leader only" : "현재 소그룹장에게만 보이는 요청";
  let subInfoText = isEnglish ? "Once per person · Tap again to cancel" : "한 사람당 한 번 · 다시 누르면 취소";
  let defaultMemberName = isEnglish ? "Member" : "소그룹원";

  let itemsHtml = list.map(function(p) {
    let authorObj = members.find(function(m) { return m.uid === p.authorUid; });
    let authorName = (authorObj && authorObj.name) ? authorObj.name : defaultMemberName;
    let tagText = (p.visibility === 'district') ? tagCell : tagIntercession;
    
    let actionBtn = '';
    if (p.visibility === 'district') {
      let pObj = prayed[p.id] || {};
      let isMine = !!pObj.mine;
      let cnt = pObj.count ? pObj.count : 0;
      let btnText = isMine ? cancelPrayText : prayBtnText;
      actionBtn = '<button class="secondary" data-pray="' + esc(p.id) + '" aria-pressed="' + isMine + '">🙏 ' + btnText + ' · ' + cnt + '</button>';
    } else {
      actionBtn = '<span class="small">' + leaderOnlyText + '</span>';
    }

    return '<article class="prayer"><span class="tag">' + tagText + '</span><div class="small" style="margin-top:10px">' + esc(authorName) + '</div><h3>' + esc(p.title) + '</h3><p>' + esc(p.body) + '</p>' + actionBtn + '</article>';
  }).join('');
  if (!itemsHtml) itemsHtml = '<p class="muted">' + noPrayerText + '</p>';

  return '<section class="card warm"><div class="row"><div><h2>' + t.prayers + '</h2><span class="small">' + subInfoText + '</span></div><button class="primary" data-page="form">' + writeBtnText + '</button></div></section><section class="card">' + itemsHtml + '</section>';
}

function form() {
  let formHeader = isEnglish ? "New Prayer Request" : "기도제목 등록";
  let titleLabel = isEnglish ? "Title" : "제목";
  let bodyLabel = isEnglish ? "Content" : "내용";
  let scopeLabel = isEnglish ? "Sharing Scope" : "공유 범위";
  let optDistrict = isEnglish ? "Share with Cell Group" : "우리 소그룹에 공유";
  let optIntercession = isEnglish ? "Intercession Team Request (Leader only)" : "중보기도팀 전달 요청 (소그룹장만 확인하기)";
  let formTip = isEnglish ? "Requests are visible only to the leader. The leader will pass them to the intercession team." : "요청은 소그룹장에게만 보입니다. 소그룹장이 직접 중보기도팀에 전달합니다.";
  let cancelText = isEnglish ? "Cancel" : "취소";
  let submitText = isEnglish ? "Submit" : "등록";

  return '<form class="card" id="prayerForm"><h2>' + formHeader + '</h2><label class="field">' + titleLabel + '<input name="title" maxlength="60" required></label><label class="field">' + bodyLabel + '<textarea name="body" maxlength="2000" required></textarea></label><label class="field">' + scopeLabel + '<select name="visibility"><option value="district">' + optDistrict + '</option><option value="intercession">' + optIntercession + '</option></select></label><p class="small">' + formTip + '</p><div class="row"><button type="button" class="secondary" data-page="prayers">' + cancelText + '</button><button class="primary" type="submit">' + submitText + '</button></div></form>';
}

function saveAttendance(uid, edit) {
  if (busy) return;
  if (weekMeta.isClosed && member.role !== 'leader') {
    flash(isEnglish ? "This week is closed." : "마감된 주차입니다.", true);
    return;
  }
  busy = true;
  let r = JSON.parse(JSON.stringify(attendance[uid] || blank(uid)));
  edit(r);
  if (r.services.sunday1 || r.services.sunday2 || r.services.afternoon) {
    r.sundayAbsenceReason = '';
  }
  setDoc(attRef(uid), r).then(function() {
    attendance[uid] = r;
    draw();
    busy = false;
  }).catch(function(e) {
    fail(e);
    draw();
    busy = false;
  });
}

function watchAttendance(uid) {
  if (watched.has(uid)) return;
  watched.add(uid);
  listeners.push(onSnapshot(attRef(uid), function(s) {
    attendance[uid] = s.exists() ? s.data() : blank(uid);
    if (page === 'home' || page === 'manage') draw();
  }, fail));
}

function watchReactions(p) {
  if (p.visibility !== 'district' || watched.has('p:' + p.id)) return;
  watched.add('p:' + p.id);
  listeners.push(onSnapshot(collection(db, 'districts', district, 'prayers', p.id, 'prayedBy'), function(s) {
    prayed[p.id] = { count: s.size, mine: s.docs.some(function(d) { return d.id === user.uid; }) };
    if (page === 'prayers') draw();
  }, fail));
}

function watchData() {
  stop();
  attendance = {};
  prayers = [];

  metaUnsub = onSnapshot(weekMetaRef(), function(s) {
    weekMeta = s.exists() ? s.data() : { isClosed: false };
    if (page === 'home' || page === 'manage') draw();
  }, function(e) { console.error(e); });

  if (member && member.role === 'leader') {
    listeners.push(onSnapshot(collection(db, 'districts', district, 'members'), function(s) {
      members = s.docs.map(function(d) { return Object.assign({ uid: d.id }, d.data()); });
      members.forEach(function(m) { watchAttendance(m.uid); });
      draw();
    }, fail));
    listeners.push(onSnapshot(collection(db, 'districts', district, 'joinRequests'), function(s) {
      requests = s.docs.map(function(d) { return Object.assign({ uid: d.id }, d.data()); });
      if (page === 'join') draw();
    }, fail));
    listeners.push(onSnapshot(collection(db, 'districts', district, 'invites'), function(s) {
      invites = s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      if (page === 'join') draw();
    }, fail));
  } else {
    members = [Object.assign({ uid: user.uid }, member)];
    watchAttendance(user.uid);
  }

  listeners.push(onSnapshot(query(collection(db, 'districts', district, 'prayers'), where('visibility', '==', 'district')), function(s) {
    prayers = prayers.filter(function(p) { return p.visibility !== 'district'; }).concat(s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }));
    prayers.forEach(watchReactions);
    if (page === 'prayers') draw();
  }, fail));

  if (member && member.role === 'leader') {
    listeners.push(onSnapshot(query(collection(db, 'districts', district, 'prayers'), where('visibility', '==', 'intercession')), function(s) {
      prayers = prayers.filter(function(p) { return p.visibility !== 'intercession'; }).concat(s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }));
      if (page === 'prayers') draw();
    }, fail));
  } else {
    listeners.push(onSnapshot(query(collection(db, 'districts', district, 'prayers'), where('authorUid', '==', user.uid)), function(s) {
      let own = s.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      prayers = prayers.filter(function(p) { return p.visibility === 'district' || p.authorUid !== user.uid; }).concat(own.filter(function(p) { return p.visibility === 'intercession'; }));
      if (page === 'prayers') draw();
    }, fail));
  }
}

resetAuth();
function resetAuth() {
  onAuthStateChanged(auth, function(u) {
    stop();
    if (memberUnsub) {
      memberUnsub();
      memberUnsub = null;
    }
    user = u;
    member = null;
    memberLoaded = false;
    myRequest = null;
    members = [];
    attendance = {};
    prayers = [];
    draw();
    if (!u) return;
    memberUnsub = onSnapshot(memberRef(u.uid), function(s) {
      let was = !!member;
      member = s.exists() ? s.data() : null;
      memberLoaded = true; // 멤버 조회 완료 플래그 설정
      if (member) {
        if (!was) watchData();
        else draw();
      } else {
        stop();
        listeners.push(onSnapshot(doc(db, 'districts', district, 'joinRequests', u.uid), function(r) {
          myRequest = r.exists() ? r.data() : null;
          draw();
        }, fail));
        draw();
      }
    }, fail);
  });
}

document.addEventListener('change', function(e) {
  let target = e.target;
  if (target.id === 'weekSelector') {
    selectedWeek = target.value;
    if (member) watchData();
    draw();
    return;
  }
  if (target.dataset.dawn) {
    saveAttendance(target.dataset.dawn, function(r) {
      r.dawn = Math.max(0, Math.min(7, Math.trunc(Number(target.value) || 0)));
    });
  }
  if (target.dataset.reason) {
    saveAttendance(target.dataset.reason, function(r) {
      r.sundayAbsenceReason = target.value;
    });
  }
});

document.addEventListener('click', function(e) {
  let tBtn = e.target.closest('button');
  if (!tBtn) return;

  if (tBtn.id === 'langToggle') {
    currentLang = (currentLang === 'ko') ? 'en' : 'ko';
    localStorage.setItem('app_lang', currentLang);
    isEnglish = (currentLang === 'en');
    updateSvc();
    draw();
    return;
  }

  if (tBtn.id === 'toggleCloseWeek') {
    let nextStatus = !weekMeta.isClosed;
    setDoc(weekMetaRef(), { isClosed: nextStatus }, { merge: true }).then(function() {
      flash(nextStatus ? (isEnglish ? 'Attendance closed.' : '출석 마감이 완료되었습니다.') : (isEnglish ? 'Attendance opened.' : '마감이 해제되었습니다.'));
    }).catch(function(err) { fail(err); });
    return;
  }

  if (tBtn.id === 'login') {
    signInWithPopup(auth, new GoogleAuthProvider()).catch(function(err) {
      if (err.code !== 'auth/popup-closed-by-user') fail(err);
    });
    return;
  }
  if (tBtn.id === 'account') {
    signOut(auth);
    return;
  }
  if (tBtn.id === 'newCode') {
    tBtn.disabled = true;
    let code = crypto.randomUUID();
    setDoc(doc(db, 'districts', district, 'invites', code), { createdBy: user.uid, createdAt: serverTimestamp() }).then(function() {
      flash(isEnglish ? "Participation code created. Share it with members." : "참여코드를 만들었어요. 복사해서 소그룹원에게 전달하세요.");
      tBtn.disabled = false;
    }).catch(function(err) {
      fail(err);
      tBtn.disabled = false;
    });
    return;
  }
  if (tBtn.dataset.copyCode) {
    navigator.clipboard.writeText(tBtn.dataset.copyCode).then(function() {
      flash(isEnglish ? "Participation code copied." : "참여코드를 복사했어요.");
    }).catch(function(err) {
      fail(err);
    });
    return;
  }
  if (tBtn.dataset.removeCode) {
    deleteDoc(doc(db, 'districts', district, 'invites', tBtn.dataset.removeCode)).then(function() {
      flash(isEnglish ? "Participation code revoked." : "코드 폐기했어요.");
    }).catch(function(err) {
      fail(err);
    });
    return;
  }
  if (tBtn.dataset.approve) {
    tBtn.disabled = true;
    let r = requests.find(function(x) { return x.uid === tBtn.dataset.approve; });
    if (!r) {
      tBtn.disabled = false;
      return;
    }
    let b = writeBatch(db);
    b.set(memberRef(r.uid), { name: r.name, role: 'member' });
    b.delete(doc(db, 'districts', district, 'joinRequests', r.uid));
    b.commit().then(function() {
      flash(r.name + (isEnglish ? " has been approved as a member." : "님을 소그룹원으로 승인했어요."));
      tBtn.disabled = false;
    }).catch(function(err) {
      fail(err);
      tBtn.disabled = false;
    });
    return;
  }
  if (tBtn.dataset.promote) {
    let m = members.find(function(x) { return x.uid === tBtn.dataset.promote; });
    if (!m || m.role !== 'member') return;
    let confirmMsg = isEnglish ? "Do you want to grant leader permissions to " + m.name + "?" : m.name + "님에게 소그룹장 권한을 줄까요?";
    if (!confirm(confirmMsg)) return;
    tBtn.disabled = true;
    let docRef = memberRef(m.uid);
    setDoc(docRef, { role: 'leader' }, { merge: true }).then(function() {
      flash(m.name + (isEnglish ? " has been granted leader permissions." : "님에게 소그룹장 권한을 주었어요."));
      tBtn.disabled = false;
    }).catch(function(err) {
      fail(err);
      tBtn.disabled = false;
    });
    return;
  }
  if (tBtn.dataset.reject) {
    deleteDoc(doc(db, 'districts', district, 'joinRequests', tBtn.dataset.reject)).then(function() {
      flash(isEnglish ? "Join request rejected." : "가입 요청을 거절했어요.");
    }).catch(function(err) {
      fail(err);
    });
    return;
  }
  if (tBtn.dataset.page) {
    page = tBtn.dataset.page;
    draw();
    return;
  }
  if (tBtn.dataset.attend) {
    saveAttendance(tBtn.dataset.uid, function(r) {
      r.services[tBtn.dataset.attend] = !r.services[tBtn.dataset.attend];
    });
    return;
  }
  if (tBtn.dataset.pray) {
    let r = prayRef(tBtn.dataset.pray);
    let pObj = prayed[tBtn.dataset.pray] || {};
    if (pObj.mine) {
      deleteDoc(r).catch(function(err) { fail(err); });
    } else {
      setDoc(r, { prayedAt: serverTimestamp() }).catch(function(err) { fail(err); });
    }
  }
});

document.addEventListener('submit', function(e) {
  if (e.target.id === 'joinForm') {
    e.preventDefault();
    let f = new FormData(e.target);
    let name = String(f.get('name') || '').trim();
    let code = String(f.get('code') || '').trim();
    if (!name || name.length > 40 || !code) return;
    let b = e.target.querySelector('[type=submit]');
    b.disabled = true;
    setDoc(doc(db, 'districts', district, 'joinRequests', user.uid), { name: name, code: code, uid: user.uid, requestedAt: serverTimestamp() }).then(function() {
      flash(isEnglish ? "Join request sent." : "가입 요청을 보냈어요.");
    }).catch(function(err) {
      fail(err);
      b.disabled = false;
    });
    return;
  }
  if (e.target.id !== 'prayerForm') return;
  e.preventDefault();
  let f = new FormData(e.target);
  let title = String(f.get('title') || '').trim();
  let body = String(f.get('body') || '').trim();
  if (!title || !body) return;
  let b = e.target.querySelector('[type=submit]');
  b.disabled = true;
  addDoc(collection(db, 'districts', district, 'prayers'), { authorUid: user.uid, title: title, body: body, visibility: f.get('visibility'), createdAt: serverTimestamp() }).then(function() {
    page = 'prayers';
    draw();
    flash(isEnglish ? "Prayer request registered." : "기도제목을 등록했어요.");
  }).catch(function(err) {
    fail(err);
    b.disabled = false;
  });
});

draw();
</script>
</body>
</html>
